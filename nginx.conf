server {
    listen 80;
    server_name dev.backend.ring-mig.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dev.backend.ring-mig.com;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/dev.backend.ring-mig.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.backend.ring-mig.com/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Proxy settings
    client_max_body_size 1000M;

    location / {
        proxy_pass http://web:8006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
    }
}
