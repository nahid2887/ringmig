version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ringmig_postgres
    environment:
      POSTGRES_DB: ringmig_db
      POSTGRES_USER: ringmig_user
      POSTGRES_PASSWORD: ringmig_password_123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ringmig_user -d ringmig_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ringmig_redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: ringmig_web
    command: bash -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8006"
    env_file:
      - .env
    environment:
      DEBUG: "False"
      DB_HOST: "db"
      REDIS_HOST: "redis"
    volumes:
      - .:/app
      - media_data:/app/core/media
      - static_data:/app/core/static
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend_folder # Change this to your frontend directory
      dockerfile: Dockerfile
    container_name: ringmig_frontend
    restart: always
    # No ports needed here, Nginx will talk to it internally

  nginx:
    image: nginx:alpine
    container_name: ringmig_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - static_data:/app/backend_static:ro # To serve Django static files
      - media_data:/app/backend_media:ro   # To serve Django media files
    depends_on:
      - web
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  static_data: